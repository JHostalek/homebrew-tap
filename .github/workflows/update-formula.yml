name: Update Formula

on:
  workflow_dispatch:
    inputs:
      formula:
        description: Formula name
        required: true
        type: choice
        options: [ares, hs, junior, terna, vvz]
      tag:
        description: Release tag (vMAJOR.MINOR.PATCH)
        required: true
        type: string
      repository:
        description: Source repository
        required: true
        type: choice
        options:
          - JHostalek/ares-cli
          - JHostalek/hlidac-statu-cli
          - JHostalek/junior
          - JHostalek/terna-cli
          - JHostalek/vvz-cli

concurrency:
  group: formula-${{ inputs.formula }}
  cancel-in-progress: false

jobs:
  verify-formula:
    runs-on: macos-15
    timeout-minutes: 20
    permissions:
      attestations: read
      contents: read
    outputs:
      changed: ${{ steps.release.outputs.changed }}
      sha256: ${{ steps.release.outputs.sha256 }}
      version: ${{ steps.release.outputs.version }}
    env:
      FORMULA: ${{ inputs.formula }}
      TAG: ${{ inputs.tag }}
      REPOSITORY: ${{ inputs.repository }}
    steps:
      - name: Checkout tap repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate release identity
        run: |
          case "$FORMULA:$REPOSITORY" in
            ares:JHostalek/ares-cli | hs:JHostalek/hlidac-statu-cli | junior:JHostalek/junior | terna:JHostalek/terna-cli | vvz:JHostalek/vvz-cli) ;;
            *)
              echo "Formula and repository do not match" >&2
              exit 2
              ;;
          esac
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag must match vMAJOR.MINOR.PATCH" >&2
            exit 2
          fi
          test -f "Formula/$FORMULA.rb"

      - name: Download and verify release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${TAG#v}"
          ASSET="${FORMULA}-macos-arm64-${TAG}.tar.gz"
          RELEASE_URL="https://github.com/${REPOSITORY}/releases/download/${TAG}"

          curl --fail --location --retry 3 --output "$ASSET" "$RELEASE_URL/$ASSET"
          curl --fail --location --retry 3 --output "$ASSET.sha256" "$RELEASE_URL/$ASSET.sha256"

          EXPECTED="$(awk -v asset="$ASSET" '$2 == asset { print $1 }' "$ASSET.sha256")"
          ACTUAL="$(shasum -a 256 "$ASSET" | awk '{ print $1 }')"
          if [[ ! "$EXPECTED" =~ ^[0-9a-f]{64}$ ]] || [[ "$ACTUAL" != "$EXPECTED" ]]; then
            echo "Release checksum verification failed" >&2
            exit 1
          fi
          gh attestation verify "$ASSET" \
            --repo "$REPOSITORY" \
            --signer-workflow "$REPOSITORY/.github/workflows/release.yml"

          CURRENT_VERSION="$(ruby -e 'puts File.read(ARGV.fetch(0))[%r{/download/v([^/]+)/}, 1]' "Formula/$FORMULA.rb")"
          CURRENT_SHA="$(ruby -e 'puts File.read(ARGV.fetch(0))[/^  sha256 \"([0-9a-f]+)\"$/, 1]' "Formula/$FORMULA.rb")"
          if [[ "$CURRENT_VERSION" == "$VERSION" && "$CURRENT_SHA" == "$ACTUAL" ]]; then
            echo "Formula $FORMULA is already at $TAG"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          ruby scripts/update-formula.rb \
            "Formula/$FORMULA.rb" \
            "$RELEASE_URL/$ASSET" \
            "$ACTUAL"

          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "sha256=$ACTUAL" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Validate candidate formula
        if: steps.release.outputs.changed == 'true'
        run: |
          brew tap --custom-remote JHostalek/tap "$GITHUB_WORKSPACE"
          brew audit --strict --online "JHostalek/tap/$FORMULA"
          brew install "JHostalek/tap/$FORMULA"
          brew test "JHostalek/tap/$FORMULA"

  publish-formula:
    needs: verify-formula
    if: needs.verify-formula.outputs.changed == 'true'
    runs-on: macos-15
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    env:
      FORMULA: ${{ inputs.formula }}
      REPOSITORY: ${{ inputs.repository }}
      SHA256: ${{ needs.verify-formula.outputs.sha256 }}
      TAG: ${{ inputs.tag }}
      VERSION: ${{ needs.verify-formula.outputs.version }}
    steps:
      - name: Checkout tap repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Apply verified formula update
        run: |
          ASSET="${FORMULA}-macos-arm64-${TAG}.tar.gz"
          ASSET_URL="https://github.com/${REPOSITORY}/releases/download/${TAG}/${ASSET}"
          ruby scripts/update-formula.rb \
            "Formula/$FORMULA.rb" \
            "$ASSET_URL" \
            "$SHA256"

      - name: Publish tested formula update
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BRANCH="formula/${FORMULA}-${VERSION}"
          gh auth setup-git
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add "Formula/$FORMULA.rb"
          git commit -m "$FORMULA v$VERSION"
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null; then
            git fetch origin \
              "refs/heads/$BRANCH:refs/remotes/origin/$BRANCH"
          else
            STATUS=$?
            if [[ "$STATUS" -ne 2 ]]; then
              exit "$STATUS"
            fi
          fi
          git push --force-with-lease origin "HEAD:refs/heads/$BRANCH"

          PR_URL="$(gh pr list \
            --base main \
            --head "${GITHUB_REPOSITORY_OWNER}:$BRANCH" \
            --state open \
            --json url \
            --jq '.[0].url')"
          if [[ -z "$PR_URL" ]]; then
            PR_URL="$(gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "$FORMULA v$VERSION" \
              --body "Automated, verified formula update for $FORMULA v$VERSION.")"
          fi
          gh pr merge "$PR_URL" --squash --delete-branch
